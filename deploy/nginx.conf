# Naboo Automotive — production edge proxy.
# Terminates TLS for naboo.co.tz + www.naboo.co.tz, serves the Angular bundle,
# and proxies API traffic to the backend container.

server {
    listen 80;
    server_name naboo.co.tz www.naboo.co.tz;

    # ACME http-01 challenge for Let's Encrypt issuance/renewal.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://naboo.co.tz$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name www.naboo.co.tz;

    ssl_certificate     /etc/letsencrypt/live/naboo.co.tz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/naboo.co.tz/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://naboo.co.tz$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name naboo.co.tz;

    ssl_certificate     /etc/letsencrypt/live/naboo.co.tz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/naboo.co.tz/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    root /usr/share/nginx/html;
    index index.html;

    # Security headers
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    client_max_body_size 11m;   # matches spring.servlet.multipart limits

    # --- API ---
    location /graphql {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        limit_req zone=api burst=20 nodelay;
    }

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        limit_req zone=api burst=10 nodelay;
    }

    location /actuator/ {
        return 404;
    }

    # --- Uploaded media (long cache: filenames are content-unique) ---
    location /uploads/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff always;
    }

    # --- Angular app ---
    location ~* \.(js|css|png|jpg|jpeg|webp|svg|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
