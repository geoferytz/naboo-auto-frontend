# First-boot config used until Let's Encrypt certificates exist.
# Swap the mounted file to nginx.conf once certificates are issued (see deploy docs).

server {
    listen 80;
    server_name naboo.co.tz www.naboo.co.tz;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    root /usr/share/nginx/html;
    index index.html;

    location /graphql { proxy_pass http://backend:8080; proxy_set_header Host $host; }
    location /api/    { proxy_pass http://backend:8080; proxy_set_header Host $host; }
    location /uploads/ { proxy_pass http://backend:8080; proxy_set_header Host $host; }
    location /actuator/ { return 404; }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
