# Local development services only. Production compose is delivered in Milestone 7.
name: naboo-dev

services:
  naboo-postgres:
    image: postgres:17.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-naboo_automotive}
      POSTGRES_USER: ${POSTGRES_USER:-naboo_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      TZ: UTC
    ports:
      - "127.0.0.1:${DB_PORT:-5433}:5432"
    volumes:
      - naboo-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  naboo-pgdata:
